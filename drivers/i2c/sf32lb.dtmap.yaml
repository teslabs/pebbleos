compatible: sifli,sf32lb52-i2c
config: I2C_SF32LB
include: pbl/drivers/i2c/sf32lb.h
type: struct pbl_i2c_sf32lb
class: {type: struct pbl_i2c_bus, member: bus, include: pbl/drivers/i2c.h}
define: PBL_I2C_SF32LB_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - clock: 0
  - prop: clock-frequency
    default: 100000
  - pinctrl: default
  - dma: rx
    default: nullptr
  - literal: nullptr
irqs:
  - {irq: 0, prio: 5, isr: pbl_i2c_sf32lb_irq_handler}
provides:
  i2c: "&{sym}"
