%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/sifli,sf32lb52-dmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 DMA controller (DMAC)

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Eight-channel DMA controller. DMA specifiers take two cells, the channel
  (0 to 7) and the request line of the peripheral.

allOf:
  - $ref: /schemas/dma/dma-controller.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-dmac

  reg:
    maxItems: 1

  interrupts:
    description: One interrupt per channel, in channel order.
    minItems: 8
    maxItems: 8

  clocks:
    maxItems: 1

  '#dma-cells':
    const: 2

  dma-channels:
    const: 8

  dma-requests:
    maximum: 64

required:
  - compatible
  - reg
  - interrupts
  - '#dma-cells'

unevaluatedProperties: false

examples:
  - |
    dma-controller@50081000 {
        compatible = "sifli,sf32lb52-dmac";
        reg = <0x50081000 0x1000>;
        interrupts = <50 5>, <51 5>, <52 5>, <53 5>,
                     <54 5>, <55 5>, <56 5>, <57 5>;
        #dma-cells = <2>;
        dma-channels = <8>;
        dma-requests = <64>;
    };
