%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/sifli,sf32lb52-pdm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 PDM controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Pulse density modulation interface for up to two digital microphones
  sharing a clock and a data line, with its decimation filters.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-pdm

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    items:
      - const: rx

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - dmas
  - dma-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sifli,sf32lb52-rcc.h>

    pdm@5009a000 {
        compatible = "sifli,sf32lb52-pdm";
        reg = <0x5009a000 0x1000>;
        interrupts = <82 5>;
        clocks = <&rcc SF32LB52_CLK_PDM1>;
        dmas = <&dmac1 4 36>;
        dma-names = "rx";
        #sound-dai-cells = <0>;
    };
