%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/sifli,sf32lb52-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 I2C controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  clock-frequency:
    enum: [100000, 400000, 1000000]

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/sifli,sf32lb52-rcc.h>
    #include <dt-bindings/reset/sifli,sf32lb52-rcc.h>

    i2c@5009c000 {
        compatible = "sifli,sf32lb52-i2c";
        reg = <0x5009c000 0x1000>;
        interrupts = <61 5>;
        clocks = <&rcc SF32LB52_CLK_I2C1>;
        resets = <&rcc SF32LB52_RST_I2C1>;
        clock-frequency = <400000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
