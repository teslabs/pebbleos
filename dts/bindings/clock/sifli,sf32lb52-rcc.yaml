%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sifli,sf32lb52-rcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 reset and clock controller (HPSYS RCC)

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  The RCC gates the clocks of the HPSYS peripherals and holds them in reset.
  Clock specifiers take one cell, a clock ID from
  <dt-bindings/clock/sifli,sf32lb52-rcc.h>; reset specifiers one cell, a
  reset ID from <dt-bindings/reset/sifli,sf32lb52-rcc.h>.

properties:
  compatible:
    const: sifli,sf32lb52-rcc

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@50000000 {
        compatible = "sifli,sf32lb52-rcc";
        reg = <0x50000000 0x1000>;
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
