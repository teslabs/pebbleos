compatible:
  - arm,armv7m-nvic
  - arm,v6m-nvic
  - arm,v7m-nvic
  - arm,v8m-nvic
provides:
  interrupt-controller:
    connect:
      irq: 0
      priority: 1
    specifiers:
      line:
        type: u16
        value: {cell: 0}
      priority:
        type: u8
        value: {cell: 1}
